<!doctype html>
<!-- SMOKE TEST PAGE (not a demo campaign). Planted issues:
  1. page shows -20% (an ad would say -50%)           -> extractOffer.discounts
  2. shipping costs 19,99 lei (ad says free delivery) -> extractOffer.shipping
  3. "Buy Now" -> /checkout-does-not-exist (404)      -> checkLinks (critical)
  4. "Order today" anchor with href="#"               -> checkLinks (no destination)
  5. grey-on-grey conditions text                     -> checkAccessibility color-contrast
  6. product image without alt                        -> checkAccessibility image-alt
  7. icon button without accessible name              -> checkAccessibility button-name
  8. "Only 2 left!" + countdown                       -> extractOffer.stock / urgency
  9. no lang attribute                                -> checkAccessibility html-has-lang
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlowPure Hydra Cream – Special Offer</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "GlowPure Hydra Cream 50 ml",
    "brand": { "@type": "Brand", "name": "GlowPure" },
    "sku": "GP-HC-50",
    "offers": {
      "@type": "Offer",
      "price": "119.99",
      "priceCurrency": "RON",
      "availability": "https://schema.org/InStock",
      "priceSpecification": { "@type": "UnitPriceSpecification", "priceType": "https://schema.org/ListPrice", "price": "149.99", "priceCurrency": "RON" }
    }
  }
  </script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
    header { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .hero { padding: 24px 16px; display: grid; gap: 16px; max-width: 900px; margin: auto; }
    .hero img { width: 100%; max-width: 420px; border-radius: 12px; }
    .price { font-size: 28px; font-weight: 700; }
    .old { text-decoration: line-through; color: #555; margin-left: 8px; font-size: 18px; }
    .badge { background: #c62828; color: #fff; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
    .btn { display: inline-block; background: #111; color: #fff; padding: 14px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .fine { color: #c4c4c4; background: #e9e9e9; font-size: 13px; padding: 8px; }
    .stock { color: #c62828; font-weight: 700; }
    .icon-btn { width: 40px; height: 40px; border: 0; background: #eee; border-radius: 50%; }
  </style>
</head>
<body>
  <header>
    <strong>GlowPure</strong>
    <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 4h-2l-1 2h2l3.6 7.6-1.4 2.4h12v-2h-10.6l1.1-2h7.4l3.9-7h-14.6z"/></svg></button>
  </header>
  <main class="hero">
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='320'><rect width='100%' height='100%' fill='%23d9eef0'/><circle cx='210' cy='160' r='90' fill='%23fff'/><text x='210' y='168' font-size='22' text-anchor='middle' fill='%23333'>Hydra Cream</text></svg>">
    <div>
      <h1>GlowPure Hydra Cream</h1>
      <p>48h hydration. Clinically proven. 100% natural.</p>
      <p><span class="badge">-20%</span></p>
      <p class="price">119,99 lei <span class="old">149,99 lei</span></p>
      <p class="stock">Only 2 left! Offer ends in 02:14:59</p>
      <p><a class="btn" href="/demo-site/checkout-does-not-exist">Buy Now</a></p>
      <p><a class="btn" href="#">Order today</a></p>
      <p><a href="/demo-site/flawed-shop/details.html">Product details</a> · <a href="/demo-site/clean-shop/index.html">Our other products</a></p>
      <p class="fine">Delivery: courier shipping 19,99 lei. Returns within 14 days. 2-year warranty.</p>
    </div>
  </main>
</body>
</html>
